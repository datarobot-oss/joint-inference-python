version: "3"

set: [errexit, nounset, pipefail]
silent: true

vars:
  PYTHON_VERSION: '{{.PYTHON_VERSION | default "3.13.3"}}'
  TYPOS_VERSION: '{{.TYPOS_VERSION | default "1.45.1"}}'
  # Keep in step with the insert-license hook in .pre-commit-config.yaml.
  SKYWALKING_EYES_VERSION: '{{.SKYWALKING_EYES_VERSION | default "0.8.0"}}'
  # docker resolves the digest and ignores the tag, which is kept for readers.
  OSV_SCANNER_IMAGE: ghcr.io/google/osv-scanner:v2.7.0@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0
  COVERAGE_FAIL_UNDER: '{{.COVERAGE_FAIL_UNDER | default "90"}}'
  # Starting an xdist worker imports torch, so beyond a few workers
  # startup outweighs the parallel test time.
  TEST_MAX_WORKERS: '{{.TEST_MAX_WORKERS | default "8"}}'
  # Shared opening of every deploy:* target: install the Pulumi program's
  # dependencies and select (or create) the stack .env names.
  DEPLOY_STACK_SETUP: |
    export PULUMI_BACKEND_URL="${PULUMI_BACKEND_URL:-file://~}"
    STACK="${JOINTFM_DEPLOY_STACK:-dev}"
    uv sync --group deploy --quiet
    cd deploy
    pulumi stack select --create "$STACK" >/dev/null

tasks:
  default:
    cmd: task --list --sort alphanumeric

  run:
    desc: "Run a command inside the project environment (usage: task run -- python ...)"
    cmd: uv run {{.CLI_ARGS}}

  setup:
    desc: Create or reuse the local Python environment and install repo tooling
    cmds:
      - uv venv --allow-existing --python {{.PYTHON_VERSION}}
      - uv sync --all-groups
      - uv run pre-commit install --hook-type pre-commit --hook-type commit-msg
      - task: install:ripgrep
      - task: install:typos
      - cmd: 'echo "OK: setup complete; activate the environment with . .venv/bin/activate"'

  lint:
    desc: Run Ruff lint checks (read-only)
    cmd: |
      if uv run ruff check .; then
        echo "OK: ruff lint passed"
      else
        echo "FAIL: ruff lint reported issues"
        exit 1
      fi

  format:
    desc: Run the Ruff formatter (rewrites files in place)
    cmd: |
      if uv run ruff format .; then
        echo "OK: ruff format applied"
      else
        echo "FAIL: ruff format could not format every file"
        exit 1
      fi

  format:check:
    desc: Check Ruff formatting without rewriting files
    cmd: |
      if uv run ruff format --check .; then
        echo "OK: ruff format check passed"
      else
        echo "FAIL: files need formatting; run task format"
        exit 1
      fi

  license-check:
    desc: Verify every Python file carries the Apache-2.0 license header (read-only; needs docker)
    preconditions:
      - sh: command -v docker >/dev/null 2>&1
        msg: "FAIL: docker is required for license-check"
    cmd: |
      if docker run --rm --volume "$PWD:/src" --workdir /src apache/skywalking-eyes:{{.SKYWALKING_EYES_VERSION}} -c .licenserc.yaml header check; then
        echo "OK: every Python file carries the license header"
      else
        echo "FAIL: files lack the license header; run task license-fix"
        exit 1
      fi

  license-fix:
    desc: Add the Apache-2.0 license header to every Python file that lacks it (needs docker)
    preconditions:
      - sh: command -v docker >/dev/null 2>&1
        msg: "FAIL: docker is required for license-fix"
    cmd: |
      if docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/src" --workdir /src apache/skywalking-eyes:{{.SKYWALKING_EYES_VERSION}} -c .licenserc.yaml header fix; then
        echo "OK: license headers applied"
      else
        echo "FAIL: skywalking-eyes could not apply every license header"
        exit 1
      fi

  typecheck:
    desc: Run ty static type checks
    cmd: |
      if uv run ty check --output-format concise --error-on-warning; then
        echo "OK: ty type check passed"
      else
        echo "FAIL: ty type check reported issues"
        exit 1
      fi

  typos:
    desc: Run the spelling checker
    cmds:
      - task: install:typos
      - |
        TYPOS="$(command -v typos || echo "$HOME/.local/bin/typos")"
        if "$TYPOS" --config typos.toml --force-exclude --sort .; then
          echo "OK: typos found no misspellings"
        else
          echo "FAIL: typos reported misspellings"
          exit 1
        fi

  leak-guard:
    desc: Fail when a tracked or untracked, non-ignored file carries private material in its path or content
    cmd: |
      if uv run python scripts/leak_guard.py tree; then
        echo "OK: leak guard found no private material in the working tree"
      else
        echo "FAIL: leak guard found private material in the working tree"
        exit 1
      fi

  leak-guard:history:
    desc: "Fail when any commit reachable from any ref carries private material in its message, paths, or file contents (narrow it with revisions: task leak-guard:history -- origin/main..HEAD)"
    cmd: |
      if uv run python scripts/leak_guard.py history {{.CLI_ARGS}}; then
        echo "OK: leak guard found no private material in the history"
      else
        echo "FAIL: leak guard found private material in the history"
        exit 1
      fi

  secret-scan:history:
    desc: Fail when any commit reachable from any ref carries a credential, scanned by gitleaks
    cmd: |
      if uv run pre-commit run --all-files --hook-stage manual gitleaks-history; then
        echo "OK: gitleaks found no credentials in the history"
      else
        echo "FAIL: gitleaks found credentials in the history"
        exit 1
      fi

  vuln-scan:
    desc: Fail when a package pinned in uv.lock has a known vulnerability, scanned by osv-scanner (needs docker)
    preconditions:
      - sh: command -v docker >/dev/null 2>&1
        msg: "FAIL: docker is required for vuln-scan"
    cmd: |
      if docker run --rm --volume "$PWD:/src" {{.OSV_SCANNER_IMAGE}} scan source --config /src/osv-scanner.toml --lockfile /src/uv.lock; then
        echo "OK: osv-scanner found no known vulnerabilities in uv.lock"
      else
        echo "FAIL: osv-scanner found known vulnerabilities in uv.lock"
        exit 1
      fi

  test:
    desc: Run the unit test suite
    cmd: |
      if uv run pytest -n auto --maxprocesses={{.TEST_MAX_WORKERS}} {{.CLI_ARGS}}; then
        echo "OK: tests passed"
      else
        echo "FAIL: tests failed"
        exit 1
      fi

  coverage:
    desc: Run the unit test suite with coverage enforcement
    cmd: |
      if uv run pytest -q -n auto --maxprocesses={{.TEST_MAX_WORKERS}} -p no:cacheprovider --cov=jointfm_inference --cov-report=term-missing:skip-covered --cov-fail-under={{.COVERAGE_FAIL_UNDER}}; then
        echo "OK: tests passed with coverage at or above {{.COVERAGE_FAIL_UNDER}}%"
      else
        echo "FAIL: tests failed or coverage is below {{.COVERAGE_FAIL_UNDER}}%"
        exit 1
      fi

  build:
    desc: Build the source distribution and wheel into dist/
    cmd: |
      rm -rf dist
      if uv build; then
        echo "OK: built $(ls dist | tr '\n' ' ')"
      else
        echo "FAIL: uv build failed"
        exit 1
      fi

  check:
    desc: Run static code quality checks (read-only; no file modifications)
    cmds:
      - task: typos
      - task: lint
      - task: format:check
      - task: typecheck
      - cmd: 'echo "OK: all static checks passed"'

  pre-commit:
    desc: Run every pre-commit hook on all files
    cmd: |
      if uv run pre-commit run --all-files; then
        echo "OK: pre-commit hooks passed"
      else
        echo "FAIL: pre-commit hooks reported issues"
        exit 1
      fi

  start:
    desc: "Fill in .env with the DataRobot CLI: dr logs in, writes DATAROBOT_ENDPOINT and DATAROBOT_API_TOKEN, and asks for the rest (dr start runs this)"
    preconditions:
      - sh: command -v dr >/dev/null 2>&1
        msg: "FAIL: task start needs the DataRobot CLI (https://github.com/datarobot-oss/cli); without it, copy .env.template to .env and fill it in"
    cmd: |
      if dr dotenv setup --if-needed && dr dotenv update; then
        echo "OK: .env is filled in"
      else
        echo "FAIL: dr could not fill in .env"
        exit 1
      fi

  serve:
    desc: Serve the checkpoint that .env configures, downloading it first when .env names a URL (stop with Ctrl-C)
    dotenv: [.env]
    preconditions:
      - sh: test -f .env
        msg: "FAIL: .env is missing; run task start, or copy .env.template to .env and fill it in"
    cmd: |
      STATUS=0
      uv run jointfm-inference serve || STATUS=$?
      # uv reports 130 or 143 when Ctrl-C or SIGTERM stopped it, even though
      # the service itself shut down cleanly.
      case "$STATUS" in
        0|130|143) echo "OK: service stopped" ;;
        *) echo "FAIL: service exited with status $STATUS"; exit 1 ;;
      esac

  probe:
    desc: "Probe the service that .env configures on this host, or the services named after -- (task probe -- --service-url http://host:8080)"
    dotenv: [.env]
    cmd: |
      if [ -n "{{.CLI_ARGS}}" ]; then
        set -- {{.CLI_ARGS}}
      else
        set -- --service-url "http://127.0.0.1:${JOINTFM_INFERENCE_PORT:-8080}"
      fi
      if uv run jointfm-inference probe "$@"; then
        echo "OK: every probed service answered every advertised return mode"
      else
        echo "FAIL: at least one probed service failed"
        exit 1
      fi

  docker:build:
    desc: Build the container image jointfm-inference:<project version>; it holds no weights
    preconditions:
      - sh: command -v docker >/dev/null 2>&1
        msg: "FAIL: docker is required for docker:build"
    cmd: |
      VERSION="$(uv version --short)"
      if docker build --file container/Dockerfile --build-arg "IMAGE_VERSION=$VERSION" --tag "jointfm-inference:$VERSION" .; then
        echo "OK: built image jointfm-inference:$VERSION"
      else
        echo "FAIL: docker build failed"
        exit 1
      fi

  docker:run:
    desc: "Run the container image on the checkpoint that .env configures, mounting its directory at /models; extra docker run options go after -- (task docker:run -- --gpus all)"
    dotenv: [.env]
    preconditions:
      - sh: command -v docker >/dev/null 2>&1
        msg: "FAIL: docker is required for docker:run"
      - sh: test -f .env
        msg: "FAIL: .env is missing; run task start, or copy .env.template to .env and fill it in"
      - sh: test -n "${JOINTFM_INFERENCE_CHECKPOINT_PATH:-}"
        msg: "FAIL: set JOINTFM_INFERENCE_CHECKPOINT_PATH in .env"
    cmd: |
      VERSION="$(uv version --short)"
      CHECKPOINT_DIR="$(dirname "$JOINTFM_INFERENCE_CHECKPOINT_PATH")"
      mkdir -p "$CHECKPOINT_DIR"
      CHECKPOINT_DIR="$(cd "$CHECKPOINT_DIR" && pwd)"
      CHECKPOINT_FILE="$(basename "$JOINTFM_INFERENCE_CHECKPOINT_PATH")"
      # Pass the service settings by name rather than with --env-file, which
      # keeps the quotes dr writes around values; the explicit ones below win.
      set --
      for NAME in $(env | sed -n 's/^\(JOINTFM_INFERENCE_[A-Z0-9_]*\)=.*/\1/p'); do
        set -- "$@" --env "$NAME"
      done
      # The container always listens on 8080 at every address; .env's bind
      # host and port choose where the host publishes it.
      if docker run --rm \
        --user "$(id -u):$(id -g)" \
        "$@" \
        --env "JOINTFM_INFERENCE_CHECKPOINT_PATH=/models/$CHECKPOINT_FILE" \
        --env JOINTFM_INFERENCE_BIND_HOST=0.0.0.0 \
        --env JOINTFM_INFERENCE_PORT=8080 \
        --publish "${JOINTFM_INFERENCE_BIND_HOST:-0.0.0.0}:${JOINTFM_INFERENCE_PORT:-8080}:8080" \
        --volume "$CHECKPOINT_DIR:/models" \
        {{.CLI_ARGS}} \
        "jointfm-inference:$VERSION"; then
        echo "OK: container stopped"
      else
        echo "FAIL: container exited with an error"
        exit 1
      fi

  deploy:preview:
    desc: Preview what task deploy would create or change in DataRobot for the checkpoint .env configures
    dotenv: [.env]
    preconditions: &deploy-preconditions
      - sh: test -f .env
        msg: "FAIL: .env is missing; run task start, or copy .env.template to .env and fill it in"
      - sh: command -v pulumi >/dev/null 2>&1
        msg: "FAIL: the pulumi CLI is required; see https://www.pulumi.com/docs/install/"
      - sh: test -n "${PULUMI_CONFIG_PASSPHRASE+set}"
        msg: "FAIL: set PULUMI_CONFIG_PASSPHRASE in .env (it may be empty)"
    cmd: |
      {{.DEPLOY_STACK_SETUP}}
      if pulumi preview {{.CLI_ARGS}}; then
        echo "OK: previewed stack $STACK"
      else
        echo "FAIL: preview of stack $STACK failed"
        exit 1
      fi

  deploy:
    desc: "Build the image in DataRobot and run it as a Workload serving the checkpoint .env configures; pulumi up asks before applying (task deploy -- --yes skips that)"
    dotenv: [.env]
    preconditions: *deploy-preconditions
    cmd: |
      {{.DEPLOY_STACK_SETUP}}
      if pulumi up {{.CLI_ARGS}}; then
        echo "OK: deployed stack $STACK; endpoint: $(pulumi stack output endpoint)"
      else
        echo "FAIL: deploy of stack $STACK failed"
        exit 1
      fi

  deploy:bundles:
    desc: List the resource bundles the DataRobot cluster in .env offers Workloads; any ID is a valid JOINTFM_DEPLOY_BUNDLE
    dotenv: [.env]
    preconditions:
      - sh: test -f .env
        msg: "FAIL: .env is missing; run task start, or copy .env.template to .env and fill it in"
      - sh: test -n "${DATAROBOT_ENDPOINT:-}" && test -n "${DATAROBOT_API_TOKEN:-}"
        msg: "FAIL: set DATAROBOT_ENDPOINT and DATAROBOT_API_TOKEN in .env"
    cmd: |
      uv sync --group deploy --quiet
      if uv run python deploy/bundles.py; then
        echo "OK: listed the Workload bundles at $DATAROBOT_ENDPOINT"
      else
        echo "FAIL: could not list the Workload bundles at $DATAROBOT_ENDPOINT"
        exit 1
      fi

  deploy:outputs:
    desc: Print the deployed Workload's endpoint and IDs
    dotenv: [.env]
    preconditions: *deploy-preconditions
    cmd: |
      {{.DEPLOY_STACK_SETUP}}
      if pulumi stack output --json; then
        echo "OK: printed the outputs of stack $STACK"
      else
        echo "FAIL: could not read the outputs of stack $STACK"
        exit 1
      fi

  deploy:probe:
    desc: Probe the deployed Workload's health and every return mode it advertises, authenticating with DATAROBOT_API_TOKEN
    dotenv: [.env]
    preconditions: *deploy-preconditions
    cmd: |
      {{.DEPLOY_STACK_SETUP}}
      ENDPOINT="$(pulumi stack output endpoint)"
      cd ..
      if uv run jointfm-inference probe --service-url "$ENDPOINT" \
        --header "Authorization: Bearer $DATAROBOT_API_TOKEN" \
        --timeout-seconds 120 {{.CLI_ARGS}}; then
        echo "OK: the Workload at $ENDPOINT answered every advertised return mode"
      else
        echo "FAIL: probing the Workload at $ENDPOINT failed"
        exit 1
      fi

  deploy:destroy:
    desc: Delete the Workload and Artifact of the stack .env names; pulumi asks before deleting
    dotenv: [.env]
    preconditions: *deploy-preconditions
    cmd: |
      {{.DEPLOY_STACK_SETUP}}
      if pulumi destroy {{.CLI_ARGS}}; then
        echo "OK: destroyed stack $STACK"
      else
        echo "FAIL: destroy of stack $STACK failed"
        exit 1
      fi

  install:ripgrep:
    desc: Install ripgrep using the available system package manager
    cmd: |
      if command -v rg >/dev/null 2>&1; then
        echo "OK: ripgrep already installed: $(command -v rg)"
        exit 0
      fi
      if command -v apt >/dev/null 2>&1; then
        sudo apt update && sudo apt install -y ripgrep
      elif command -v dnf >/dev/null 2>&1; then
        rpm -q spal-release >/dev/null 2>&1 || sudo dnf install -y spal-release
        sudo dnf install -y ripgrep
      elif command -v yum >/dev/null 2>&1; then
        sudo yum install -y ripgrep
      elif command -v brew >/dev/null 2>&1; then
        brew install ripgrep
      else
        echo "FAIL: no supported package manager found; install ripgrep manually, then rerun task setup"
        exit 1
      fi
      echo "OK: installed ripgrep: $(command -v rg)"

  install:typos:
    desc: Install typos using Homebrew when available, otherwise download a release binary with curl
    cmd: |
      LOCAL_TYPOS="$HOME/.local/bin/typos"
      if command -v typos >/dev/null 2>&1; then
        echo "OK: typos already installed: $(command -v typos)"
        exit 0
      fi
      if [ -x "$LOCAL_TYPOS" ]; then
        echo "OK: typos already installed: $LOCAL_TYPOS"
        exit 0
      fi
      if command -v brew >/dev/null 2>&1; then
        if brew list typos-cli >/dev/null 2>&1 || brew install typos-cli; then
          if command -v typos >/dev/null 2>&1; then
            echo "OK: installed typos via Homebrew: $(command -v typos)"
            exit 0
          fi
        fi
      fi
      for TOOL in curl tar install; do
        if ! command -v "$TOOL" >/dev/null 2>&1; then
          echo "FAIL: $TOOL is required to install typos; install it or typos manually, then rerun task setup"
          exit 1
        fi
      done
      VERSION="{{.TYPOS_VERSION}}"
      ARCH="$(uname -m)"
      case "$ARCH" in
        x86_64|amd64) ARCH="x86_64" ;;
        arm64|aarch64) ARCH="aarch64" ;;
        *)
          echo "FAIL: unsupported typos architecture: $ARCH"
          exit 1
          ;;
      esac
      OS_NAME="$(uname -s)"
      case "$OS_NAME" in
        Darwin) TARGET="$ARCH-apple-darwin" ;;
        Linux) TARGET="$ARCH-unknown-linux-musl" ;;
        *)
          echo "FAIL: unsupported operating system: $OS_NAME (supported: Ubuntu, Amazon Linux, macOS)"
          exit 1
          ;;
      esac
      ARCHIVE_NAME="typos-v${VERSION}-${TARGET}.tar.gz"
      DOWNLOAD_URL="https://github.com/crate-ci/typos/releases/download/v${VERSION}/${ARCHIVE_NAME}"
      INSTALL_DIR="$HOME/.local/bin"
      TMP_DIR="$(mktemp -d)"
      trap 'rm -rf "$TMP_DIR"' EXIT
      curl -fsSL "$DOWNLOAD_URL" -o "$TMP_DIR/$ARCHIVE_NAME"
      mkdir -p "$INSTALL_DIR"
      tar -xzf "$TMP_DIR/$ARCHIVE_NAME" -C "$TMP_DIR"
      install "$TMP_DIR/typos" "$INSTALL_DIR/typos"
      echo "OK: installed typos to $INSTALL_DIR/typos"
