name: Set up Task and uv
description: Install Task and uv, then sync the dependencies a job needs.

inputs:
    dependencies:
        description: >-
            "project" syncs the package and every group, torch included.
            "dev" syncs only the dev group, for tools that never import the package.
            "none" installs uv without syncing.
        required: true

runs:
    using: composite
    steps:
        - name: Install Task
          uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
          with:
              version: 3.x
              repo-token: ${{ github.token }}

        # On Linux the locked torch is the CUDA build, so the project cache is
        # gigabytes; only jobs that import the package restore or save it.
        - name: Install uv
          uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
          with:
              version: "0.10.12"
              python-version: "3.13.3"
              enable-cache: ${{ inputs.dependencies == 'project' }}
              cache-dependency-glob: |
                  uv.lock
                  pyproject.toml

        - name: Sync the project and every group
          if: inputs.dependencies == 'project'
          shell: bash
          run: uv sync --locked --all-groups

        # UV_NO_SYNC stops later `uv run` calls from installing the project.
        - name: Sync the dev group only
          if: inputs.dependencies == 'dev'
          shell: bash
          run: |
              uv sync --locked --only-group dev
              echo "UV_NO_SYNC=1" >> "$GITHUB_ENV"

        - name: Refuse an unknown dependencies value
          if: inputs.dependencies != 'project' && inputs.dependencies != 'dev' && inputs.dependencies != 'none'
          shell: bash
          run: |
              echo "::error::dependencies must be project, dev, or none, got '${{ inputs.dependencies }}'"
              exit 1
