# A pushed v* tag uploads that release to PyPI. A tag runs the workflow file of
# its own commit, so tags cut before this file existed never upload.
name: Publish to PyPI

on:
    push:
        tags:
            - "v*"

concurrency:
    group: publish-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    build:
        name: Build and check distribution
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
              with:
                  dependencies: none
            - name: Build, install into a fresh environment, serve, and probe
              run: task build
            # PyPI never accepts a version twice, so a tag that disagrees with
            # the version it carries must fail before anything is uploaded.
            - name: Require the tag to name the built version
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  WHEEL="dist/jointfm_inference-${TAG#v}-py3-none-any.whl"
                  if [ ! -f "$WHEEL" ]; then
                      echo "::error::tag $TAG does not match the built distribution: $(ls dist | tr '\n' ' ')"
                      exit 1
                  fi
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: python-package-distributions
                  path: dist/
                  if-no-files-found: error

    publish:
        name: Publish to PyPI
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment:
            name: pypi
            url: https://pypi.org/p/jointfm-inference
        permissions:
            # Trusted publishing (OIDC) mints a short-lived upload token, so the
            # repository stores no PyPI credential.
            id-token: write
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: python-package-distributions
                  path: dist/
            - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
