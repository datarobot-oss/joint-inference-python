name: Security

on:
    pull_request:
    push:
        branches: [main]
    # New advisories land without a code change, so the scan also runs weekly.
    schedule:
        - cron: "0 6 * * 1"
    workflow_dispatch:

concurrency:
    group: security-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    vuln-scan:
        name: task vuln-scan
        # Disabled: failing on every advisory, including ones whose fix sits
        # inside the uv exclude-newer cooldown, made it pure noise on PRs.
        if: false
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Install Task
              uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Scan uv.lock for known vulnerabilities
              run: task vuln-scan
