name: CI

on:
    pull_request:
    push:
        branches: [main]

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    pre-commit:
        name: task pre-commit (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest]
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install Task
              uses: arduino/setup-task@v2
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Install uv with cache
              uses: astral-sh/setup-uv@v6
              with:
                  version: "0.10.12"
                  python-version: "3.13.3"
                  enable-cache: true
                  cache-dependency-glob: |
                      uv.lock
                      pyproject.toml

            - name: Cache pre-commit environments
              uses: actions/cache@v4
              with:
                  path: ~/.cache/pre-commit
                  key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
                  restore-keys: |
                      pre-commit-${{ runner.os }}-

            - name: Install typos CLI
              uses: taiki-e/install-action@v2
              with:
                  tool: typos-cli@1.45.1

            - name: Sync project dependencies
              run: uv sync --locked --all-groups

            # macOS runners ship without docker, which the skywalking-eyes
            # hook needs; the Ubuntu job checks the license headers.
            - name: Run task pre-commit
              env:
                  SKIP: ${{ runner.os == 'macOS' && 'insert-license' || '' }}
              run: task pre-commit

            - name: Build distribution
              run: task build

    leak-guard-history:
        name: task leak-guard:history
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout with full history
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Install Task
              uses: arduino/setup-task@v2
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Install uv with cache
              uses: astral-sh/setup-uv@v6
              with:
                  version: "0.10.12"
                  python-version: "3.13.3"
                  enable-cache: true
                  cache-dependency-glob: |
                      uv.lock
                      pyproject.toml

            - name: Scan every reachable commit
              run: task leak-guard:history
