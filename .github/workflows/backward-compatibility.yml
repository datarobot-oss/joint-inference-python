# Its own workflow so a broken released checkpoint fails a check named for it.
# No paths filter: a required check must start on every pull request.
name: Backward compatibility

on:
    pull_request:
    push:
        branches: [main]

concurrency:
    group: backward-compatibility-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    jointfm-1-checkpoints:
        name: Released JointFM 1 checkpoints still load
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Task and uv
              uses: ./.github/actions/setup
              with:
                  dependencies: project

            - name: Load and predict with every released checkpoint layout
              run: task test:compatibility

            - name: Explain the failure
              if: failure()
              run: |
                  echo "::error title=Backward compatibility broken::This change stops a released JointFM 1 checkpoint from loading or changes what it predicts. See tests/compatibility/README.md."
                  {
                      echo "## Backward compatibility broken"
                      echo
                      echo "This change stops a JointFM 1 checkpoint that people hold from loading, or changes what it predicts."
                      echo
                      echo "- Do not regenerate the frozen checkpoints or edit the expected outputs to make this pass."
                      echo "- Keep the old layout loading, or treat the change as a deprecation: it needs the maintainers' approval, a higher \`CHECKPOINT_FORMAT_VERSION\`, a clear refusal, and notice."
                      echo
                      echo "Details: \`tests/compatibility/README.md\` and \"Compatibility of released exports\" in \`CONTRIBUTING.md\`."
                  } >> "$GITHUB_STEP_SUMMARY"
