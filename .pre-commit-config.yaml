fail_fast: true
default_install_hook_types: [pre-commit, commit-msg]
# Hooks without their own `stages` run only before a commit; the commit-msg
# stage then runs only the message check instead of every hook a second time.
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: insert-license
        name: insert license header
        entry: apache/skywalking-eyes:0.8.0 -c .licenserc.yaml header fix
        language: docker_image
        pass_filenames: false
        require_serial: true
        always_run: true
      - id: commitizen
        name: conventional commit message
        entry: uv run cz check --commit-msg-file
        language: system
        stages: [commit-msg]
      - id: leak-guard-message
        name: leak guard (commit message)
        entry: uv run python scripts/leak_guard.py message
        language: system
        stages: [commit-msg]
      - id: leak-guard
        name: leak guard (working tree)
        entry: task leak-guard
        language: system
        pass_filenames: false
        always_run: true
  # The leak guard matches private material, not credentials; gitleaks covers those.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
      - id: gitleaks
        alias: gitleaks-history
        name: gitleaks (every reachable commit)
        entry: gitleaks git --redact --verbose --log-opts=--all
        stages: [manual]
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: task lint
        language: system
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, jupyter]
      - id: ty-check
        name: ty check
        entry: task typecheck
        language: system
        pass_filenames: false
      - id: typos
        name: typos
        entry: task typos
        language: system
        pass_filenames: false
      - id: tests
        name: tests with coverage
        entry: task coverage
        language: system
        pass_filenames: false
        always_run: true
